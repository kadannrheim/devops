# keycloak-values.yaml для codecentric/keycloakx чарта (Quarkus-based Keycloak)

# Глобальные настройки
global:
  imageRegistry: ""

# Настройки образа Keycloak
image:
  repository: quay.io/keycloak/keycloak
  tag: 26.3.3
  pullPolicy: IfNotPresent

# command для запуска Quarkus-версии
command:
  - "/opt/keycloak/bin/kc.sh"
  - "start"
  - "--http-enabled=true"
  - "--hostname-strict=false"
  - "--proxy=edge"
  - "--http-port=8080"

# Настройки Keycloak
keycloak:
  # Для keycloakx чарта не используется username/password,
  # вместо этого используем extraEnvVars
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m
  persistence:
    deployPostgres: true
    dbVolume:
      enabled: false
    volume:
      enabled: false

# PostgreSQL
postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
    tag: 16.3.0-debian-12-r14
  persistence:
    enabled: false
  auth:
    postgresPassword: keycloak
    password: keycloak
    database: keycloak

# Настройки Ingress
ingress:
  enabled: true
  host: keycloak-1074779.radost.ru  # Для keycloakx используется host
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
  tls:
    - hosts:
        - keycloak-1074779.radost.ru
      secretName: keycloak-tls

# Дополнительные переменные окружения
extraEnvVars:
  # Администратор
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    value: password901
  
  # Настройки БД
  - name: KC_DB
    value: postgres
  - name: KC_DB_URL_HOST
    value: keycloak-postgresql
  - name: KC_DB_URL_PORT
    value: "5432"
  - name: KC_DB_URL_DATABASE
    value: keycloak
  - name: KC_DB_USERNAME
    value: postgres
  - name: KC_DB_PASSWORD
    value: keycloak
  
  # Настройки хоста и прокси
  - name: KC_HOSTNAME
    value: keycloak-1074779.radost.ru
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_PROXY
    value: edge
  - name: KC_HTTP_ENABLED
    value: "true"

# Отключаем pgchecker 
pgchecker:
  enabled: false